name: 5 Day Rolling Release Pipeline

on:
  schedule:
    - cron: '12 4 * * *'
  workflow_dispatch:

jobs:
  update-rolling-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libeccodes-dev zip
          pip install --upgrade pip setuptools wheel
          pip install numpy xarray eccodes cfgrib
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      
      - name: Run Pipeline (Past 3 Days + Future 2 Days)
        run: |
          python run_5day_rolling_release.py

      - name: Zip Each Layer Separately
        run: |
          cd osfls_files
          zip -r ../layer_1001.zip 1001/
          zip -r ../layer_700.zip 700/
          zip -r ../layer_250.zip 250/
          zip -r ../layer_10.zip 10/
          cd ..

      - name: Generate Release Body Notes
        run: |
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat <<EOF > release_notes.txt
          Automated daily release containing a rolling 5-day atmospheric sequence.
          * **Window:** Past 3 Days (-72h) to Future 2 Days (+48h) at 1-hour resolution
          * **Updated:** ${CURRENT_TIME}
          EOF

      - name: Overwrite 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "NOAA GFS Wind Data (Latest Rolling Sequence)"
          body_path: release_notes.txt
          files: |
            layer_1001.zip
            layer_700.zip
            layer_250.zip
            layer_10.zip
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
