name: 5 Day Rolling Release Pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manually triggering the run from the GitHub Actions UI

jobs:
  update-monthly-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libeccodes-dev \
            python3-eccodes \
            python3-cfgrib \
            zip
          pip install --upgrade pip setuptools wheel
          pip install xarray numpy torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run Pipeline (Past 3 Days + Future 2 Days)
        run: |
          python run_5day_rolling_release.py

      - name: Zip Each Layer Separately
        run: |
          cd osfls_files
          zip -r ../layer_1001.zip 1001/
          zip -r ../layer_700.zip 700/
          zip -r ../layer_250.zip 250/
          zip -r ../layer_10.zip 10/
          cd ..

      - name: Overwrite 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "NOAA GFS Wind Data (Latest Rolling Sequence)"
          body: |
            Automated daily release containing a rolling 5-day atmospheric sequence.
            * **Window:** Past 3 Days (-72h) to Future 2 Days (+48h) at 1-hour resolution
            * **Updated:** ${{ github.event.repository.updated_at }}
          files: |
            layer_1001.zip
            layer_700.zip
            layer_250.zip
            layer_10.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
